services:
  # Web Service running Full-Stack PeoplePay360 (Backend API + React SPA)
  - type: web
    name: peoplepay360
    env: node
    plan: free
    buildCommand: npm install && cd backend && npm install && cd ../frontend && npm install && cd .. && npm run build
    startCommand: cd backend && npx prisma migrate deploy && cd .. && npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: peoplepay360-db
          property: connectionString

databases:
  # Managed PostgreSQL Database for Production
  - name: peoplepay360-db
    databaseName: peoplepay360
    user: peoplepay360_user
    plan: free
    region: oregon
