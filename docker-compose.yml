version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: peoplepay360-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: peoplepay360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d peoplepay360"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peoplepay360-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/peoplepay360?schema=public
      JWT_SECRET: supersecretjwtkeyproductionpeoplepay360hackathon2026
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"

volumes:
  postgres_data:
